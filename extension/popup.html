<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Leone Live Advisor</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px 18px;
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f1820;
        color: #f0faf0;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .subtitle {
        font-size: 12px;
        color: #93a3b1;
        margin: 0 0 12px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #182530;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #6b7280;
      }
      .dot.live {
        background: #22c55e;
        box-shadow: 0 0 10px #22c55e;
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      .help {
        font-size: 11px;
        color: #6b7280;
        line-height: 1.45;
      }
      a {
        color: #4ade80;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>🎯 Leone Live Advisor</h1>
    <p class="subtitle">Tracking automatico consulenze Meet</p>

    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <span id="label">Caricamento…</span>
    </div>

    <p class="help">
      L'estensione marca automaticamente live/idle quando entri o esci da una
      call Google Meet. Niente da configurare.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
